<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: transparent;
  }

  .market-popup {
    --paper: #0c0c18;
    --well: #080810;
    --paper-raised: #1a1a2e;
    --rule: #454551;
    --ink: #f2f2f4;
    --ink-secondary: #aaaab2;
    --muted: #8f8f9b;
    --accent: #ff5f19;
    --accent-hover: #e5540f;
    --accent-ink: #0c0c18;
    --success: #87c867;
    --focus: #68c9ee;

    position: relative;
    display: grid;
    gap: 1.25rem;
    inline-size: 100%;
    min-inline-size: 0;
    padding: 1.5rem;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-family:
      ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .market-popup::before {
    content: "";
    position: absolute;
    inset-block-start: 0;
    inset-inline: 0;
    block-size: 2px;
    background: var(--accent);
  }

  .market-popup__close {
    position: absolute;
    inset-block-start: 0.55rem;
    inset-inline-end: 0.55rem;
    display: grid;
    inline-size: 2.75rem;
    block-size: 2.75rem;
    place-items: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 1.25rem;
  }

  .market-popup__close:hover {
    color: var(--ink);
  }

  .market-popup__close:focus-visible,
  .market-popup__action:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .market-popup__status {
    display: flex;
    gap: 0.55rem;
    align-items: center;
    padding-inline-end: 3rem;
    color: var(--success);
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .market-popup__status::before {
    content: "";
    inline-size: 0.45rem;
    block-size: 0.45rem;
    flex: 0 0 auto;
    background: currentColor;
  }

  .market-popup__copy {
    display: grid;
    gap: 0.65rem;
  }

  .market-popup h1 {
    max-inline-size: 17ch;
    margin: 0;
    color: var(--ink);
    font-size: clamp(1.35rem, 5vw, 1.8rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.08;
    text-wrap: balance;
  }

  .market-popup__copy p {
    max-inline-size: 42ch;
    margin: 0;
    color: var(--ink-secondary);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.875rem;
    line-height: 1.55;
    text-wrap: pretty;
  }

  .market-popup__readout {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0.4rem 0.8rem;
    padding: 0.75rem;
    border: 1px solid var(--rule);
    background: var(--well);
    font-size: 0.6875rem;
    line-height: 1.4;
  }

  .market-popup__readout dt {
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .market-popup__readout dd {
    margin: 0;
    color: var(--ink);
    overflow-wrap: anywhere;
  }

  .market-popup__action {
    display: inline-flex;
    min-block-size: 2.75rem;
    align-items: center;
    justify-content: center;
    padding-inline: 1rem;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background-color 120ms ease;
  }

  .market-popup__action:hover {
    background: var(--accent-hover);
  }

  @media (prefers-reduced-motion: reduce) {
    .market-popup__action {
      transition: none;
    }
  }
</style>

<section class="market-popup" aria-labelledby="market-popup-title">
  <button
    class="market-popup__close"
    type="button"
    data-mpt-close
    aria-label="Dismiss free shipping offer"
  >
    <span aria-hidden="true">&times;</span>
  </button>

  <p class="market-popup__status">Free shipping offer</p>

  <div class="market-popup__copy">
    <h1 id="market-popup-title">Free shipping on orders $100+</h1>
    <p>
      Spend $100 or more and standard shipping is on us. Keep browsing to build
      your order.
    </p>
  </div>

  <dl class="market-popup__readout">
    <dt>Shipping</dt>
    <dd>Free standard delivery</dd>
    <dt>Minimum</dt>
    <dd>$100 order value</dd>
  </dl>

  <button class="market-popup__action" type="button" data-mpt-close>
    Keep shopping <span aria-hidden="true">&rarr;</span>
  </button>
</section>
