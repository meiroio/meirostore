<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: transparent;
  }

  .market-lead {
    --paper: #0c0c18;
    --well: #080810;
    --rule: #454551;
    --ink: #f2f2f4;
    --ink-secondary: #aaaab2;
    --muted: #8f8f9b;
    --accent: #ff5f19;
    --accent-hover: #e5540f;
    --accent-ink: #0c0c18;
    --success: #87c867;
    --error: #ed6a7c;
    --focus: #68c9ee;

    position: relative;
    display: grid;
    gap: 1.25rem;
    inline-size: 100%;
    min-inline-size: 0;
    padding: 1.5rem;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-family:
      ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .market-lead::before {
    content: "";
    position: absolute;
    inset-block-start: 0;
    inset-inline: 0;
    block-size: 2px;
    background: var(--accent);
  }

  .market-lead__close {
    position: absolute;
    inset-block-start: 0.55rem;
    inset-inline-end: 0.55rem;
    display: grid;
    inline-size: 2.75rem;
    block-size: 2.75rem;
    place-items: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 1.25rem;
  }

  .market-lead__close:hover {
    color: var(--ink);
  }

  .market-lead__close:focus-visible,
  .market-lead input:focus-visible,
  .market-lead__size input:focus-visible + span,
  .market-lead__submit:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .market-lead__intro {
    display: grid;
    gap: 0.55rem;
    padding-inline-end: 3rem;
  }

  .market-lead__eyebrow {
    margin: 0;
    color: var(--accent);
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .market-lead h1,
  .market-lead h2 {
    margin: 0;
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(1.35rem, 5vw, 1.8rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.08;
    text-wrap: balance;
  }

  .market-lead__intro > p:last-child,
  .market-lead__success p {
    max-inline-size: 44ch;
    margin: 0;
    color: var(--ink-secondary);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.875rem;
    line-height: 1.5;
    text-wrap: pretty;
  }

  .market-lead__form {
    display: grid;
    gap: 1rem;
  }

  .market-lead__identity {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
  }

  .market-lead__field {
    display: grid;
    gap: 0.35rem;
    min-inline-size: 0;
    color: var(--ink-secondary);
    font-size: 0.6875rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .market-lead__field i,
  .market-lead__sizes legend i {
    color: var(--accent);
    font-style: normal;
  }

  .market-lead__field input {
    inline-size: 100%;
    min-block-size: 2.75rem;
    padding-inline: 0.75rem;
    border: 1px solid var(--rule);
    border-radius: 0;
    background: var(--well);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 1rem;
  }

  .market-lead__field input:user-invalid {
    border-color: var(--error);
  }

  .market-lead__sizes {
    display: grid;
    gap: 0.45rem;
    padding: 0;
    margin: 0;
    border: 0;
  }

  .market-lead__sizes legend {
    color: var(--ink-secondary);
    font-size: 0.6875rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .market-lead__size-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    border-block-start: 1px solid var(--rule);
    border-inline-start: 1px solid var(--rule);
  }

  .market-lead__size {
    position: relative;
    min-inline-size: 0;
    cursor: pointer;
  }

  .market-lead__size input {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .market-lead__size span {
    display: grid;
    min-block-size: 2.75rem;
    place-items: center;
    border-block-end: 1px solid var(--rule);
    border-inline-end: 1px solid var(--rule);
    color: var(--ink-secondary);
    font-size: 0.75rem;
  }

  .market-lead__size input:checked + span {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  .market-lead__subscribe {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0.65rem;
    align-items: start;
    color: var(--ink-secondary);
    cursor: pointer;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.8125rem;
    line-height: 1.45;
  }

  .market-lead__subscribe input {
    inline-size: 1.1rem;
    block-size: 1.1rem;
    margin: 0.1rem 0 0;
    accent-color: var(--accent);
  }

  .market-lead__submit {
    display: inline-flex;
    min-block-size: 2.875rem;
    align-items: center;
    justify-content: center;
    padding-inline: 1rem;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    font: inherit;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background-color 120ms ease;
  }

  .market-lead__submit:hover {
    background: var(--accent-hover);
  }

  .market-lead__success {
    display: none;
    gap: 0.75rem;
    padding-block: 1rem 0.35rem;
  }

  .market-lead__success-mark {
    display: grid;
    inline-size: 2rem;
    block-size: 2rem;
    place-items: center;
    margin: 0;
    background: var(--success);
    color: var(--accent-ink);
    font-weight: 800;
  }

  @media (max-width: 32rem) {
    .market-lead__identity {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .market-lead__submit {
      transition: none;
    }
  }
</style>

<section class="market-lead" aria-labelledby="market-lead-title">
  <button
    class="market-lead__close"
    type="button"
    data-mpt-close
    aria-label="Dismiss profile form"
  >
    <span aria-hidden="true">&times;</span>
  </button>

  <header class="market-lead__intro">
    <p class="market-lead__eyebrow">One form -&gt; a known profile</p>
    <h1 id="market-lead-title">Leave us your email.</h1>
    <p>
      See how Meiro joins a name and shirt size to the journey already captured
      in this browser.
    </p>
  </header>

  <form class="market-lead__form" method="post">
    <input type="hidden" name="form_id" value="meiro_market_lead" />

    <div class="market-lead__identity">
      <label class="market-lead__field">
        <span>First name <i aria-hidden="true">*</i></span>
        <input
          name="first_name"
          type="text"
          autocomplete="given-name"
          maxlength="80"
          required
        />
      </label>

      <label class="market-lead__field">
        <span>Email <i aria-hidden="true">*</i></span>
        <input
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="none"
          maxlength="254"
          required
        />
      </label>
    </div>

    <fieldset class="market-lead__sizes">
      <legend>Shirt size <i aria-hidden="true">*</i></legend>
      <div class="market-lead__size-grid">
        <label class="market-lead__size">
          <input type="radio" name="shirt_size" value="XS" required />
          <span>XS</span>
        </label>
        <label class="market-lead__size">
          <input type="radio" name="shirt_size" value="S" required />
          <span>S</span>
        </label>
        <label class="market-lead__size">
          <input type="radio" name="shirt_size" value="M" required />
          <span>M</span>
        </label>
        <label class="market-lead__size">
          <input type="radio" name="shirt_size" value="L" required />
          <span>L</span>
        </label>
        <label class="market-lead__size">
          <input type="radio" name="shirt_size" value="XL" required />
          <span>XL</span>
        </label>
      </div>
    </fieldset>

    <label class="market-lead__subscribe">
      <input type="checkbox" name="consent" value="true" />
      <span>Subscribe me to product emails and Meiro demo campaigns.</span>
    </label>

    <button class="market-lead__submit" type="submit">
      Create demo profile
    </button>
  </form>

  <div class="market-lead__success" data-mpt-success role="status">
    <p class="market-lead__success-mark" aria-hidden="true">&#10003;</p>
    <h2>Profile signal added.</h2>
    <p>The next Meiro experience can now use what this visit taught us.</p>
  </div>
</section>

<script>
  (function () {
    var form = document.querySelector(".market-lead__form");
    if (!form) return;

    form.addEventListener("submit", function () {
      if (!form.checkValidity()) return;

      var emailField = form.elements.namedItem("email");
      var email = emailField && "value" in emailField ? emailField.value : "";
      var consentField = form.elements.namedItem("consent");
      var consent = Boolean(consentField && consentField.checked);
      try {
        var bridge = window.parent.meiroMarket;
        if (bridge && typeof bridge.syncEmailConsent === "function") {
          bridge.syncEmailConsent(email, consent).catch(function () {});
        }
      } catch (error) {
        /* The standard web_banner_submit event still records the form. */
      }
    });
  })();
</script>
