<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: transparent;
  }

  .market-inline {
    --paper: #0c0c18;
    --well: #080810;
    --rule: #363640;
    --ink: #f2f2f4;
    --ink-secondary: #aaaab2;
    --muted: #8f8f9b;
    --accent: #ff5f19;
    --accent-hover: #e5540f;
    --accent-ink: #0c0c18;
    --focus: #68c9ee;

    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(16rem, 0.75fr);
    min-block-size: 6rem;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--well);
    color: var(--ink);
    font-family:
      ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .market-inline::before {
    content: "";
    position: absolute;
    inset-block: 0;
    inset-inline-start: 0;
    inline-size: 2px;
    background: var(--accent);
  }

  .market-inline__lead,
  .market-inline__action {
    display: grid;
    align-content: center;
    gap: 0.45rem;
    padding: 1rem 1.25rem;
  }

  .market-inline__action {
    justify-items: start;
    border-inline-start: 1px solid var(--rule);
  }

  .market-inline__eyebrow {
    margin: 0;
    color: var(--accent);
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .market-inline h1 {
    max-inline-size: 28ch;
    margin: 0;
    color: var(--ink);
    font-size: clamp(1.15rem, 2.2vw, 1.65rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.08;
    text-wrap: balance;
  }

  .market-inline__action p {
    max-inline-size: 42ch;
    margin: 0;
    color: var(--ink-secondary);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.8125rem;
    line-height: 1.5;
    text-wrap: pretty;
  }

  .market-inline a {
    display: inline-flex;
    min-block-size: 2.5rem;
    align-items: center;
    padding-inline: 1rem;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background-color 120ms ease;
  }

  .market-inline a:hover {
    background: var(--accent-hover);
  }

  .market-inline a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  @media (max-width: 38rem) {
    .market-inline {
      grid-template-columns: 1fr;
    }

    .market-inline__action {
      border-block-start: 1px solid var(--rule);
      border-inline-start: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .market-inline a {
      transition: none;
    }
  }
</style>

<section class="market-inline" aria-labelledby="market-inline-title">
  <div class="market-inline__lead">
    <p class="market-inline__eyebrow">Meiro Engage / live signal</p>
    <h1 id="market-inline-title">Your next visit starts with this one.</h1>
  </div>

  <div class="market-inline__action">
    <p>
      Browse, click, and buy. Meiro turns each signal into a storefront that
      adapts.
    </p>
    <a href="/">Explore the catalog <span aria-hidden="true">&rarr;</span></a>
  </div>
</section>
